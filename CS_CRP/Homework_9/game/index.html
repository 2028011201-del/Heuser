<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Matrix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">A MEMORY CHALLENGE</p>
        <h1>MEMORY <span>MATRIX</span></h1>
      </div>
      <button id="muteBtn" class="small-button" type="button" aria-pressed="false">🔊 Sound on</button>
    </header>
    <section class="status-panel" aria-live="polite">
      <div><span class="stat-label">ROUND</span><strong id="roundValue">0</strong></div>
      <div><span class="stat-label">SCORE</span><strong id="scoreValue">0</strong></div>
      <div><span class="stat-label">BEST</span><strong id="bestValue">0</strong></div>
    </section>
    <section class="game-panel">
      <p id="message" class="message">Ready to test your memory?</p>
      <div class="board" id="board" aria-label="Four-button memory game">
        <button class="tile tile-red" data-tile="0" aria-label="Red tile" type="button"></button>
        <button class="tile tile-blue" data-tile="1" aria-label="Blue tile" type="button"></button>
        <button class="tile tile-yellow" data-tile="2" aria-label="Yellow tile" type="button"></button>
        <button class="tile tile-green" data-tile="3" aria-label="Green tile" type="button"></button>
      </div>
      <div class="controls">
        <button id="startBtn" class="primary-button" type="button">Start game</button>
        <button id="pauseBtn" class="secondary-button" type="button" disabled>Pause</button>
        <button id="restartBtn" class="secondary-button" type="button">Restart</button>
        <button id="resetDataBtn" class="secondary-button" type="button">Reset best score</button>
      </div>
      <p class="hint">Watch the tiles. Then repeat the sequence in the same order.</p>
    </section>
    <footer>FOCUS • REMEMBER • REPEAT · <a class="home-return" href="/">BACK TO HOME</a></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
